name: Build BANG RM Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - bang-rm-infra-improvs

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout BANG RM packages
        uses: actions/checkout@v4

      - name: Verify BANG RM package identity
        run: |
          echo "=== BANG RM PACKAGE IDENTITY ==="
          grep -n 'TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh
          grep -n 'TERMUX_APP_PACKAGE=' scripts/properties.sh
          grep -n 'TERMUX__PREFIX=' scripts/properties.sh

      - name: Build BANG RM package-builder
        run: |
          docker build \
            --tag ghcr.io/termux/package-builder:latest \
            scripts/

      - name: Repair BANG RM APT Contents indexes
        env:
          BANG_RM_APT_TOKEN: ${{ secrets.BANG_RM_APT_TOKEN }}
        run: |
          set -e

          test -n "$BANG_RM_APT_TOKEN" || {
            echo "ERROR: BANG_RM_APT_TOKEN belum tersedia."
            exit 1
          }

          sudo apt-get update
          sudo apt-get install -y apt-utils

          rm -rf apt-pages

          git clone \
            "https://x-access-token:${BANG_RM_APT_TOKEN}@github.com/rejjalmakky/bang-rm-apt.git" \
            apt-pages

          cd apt-pages

          test -d pool/main
          test -d dists/stable

          for ARCH in aarch64 arm i686 x86_64; do
            apt-ftparchive contents pool/main \
              > "dists/stable/Contents-${ARCH}"

            gzip -9c \
              "dists/stable/Contents-${ARCH}" \
              > "dists/stable/Contents-${ARCH}.gz"

            test -s "dists/stable/Contents-${ARCH}.gz"
            gzip -t "dists/stable/Contents-${ARCH}.gz"

            echo "Contents-${ARCH}: $(wc -l < "dists/stable/Contents-${ARCH}") entries"
          done

          git config user.name "BANG RM Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dists/stable/Contents-*

          if git diff --cached --quiet; then
            echo "APT Contents indexes already current."
          else
            git commit -m "Repair BANG RM APT Contents indexes"
            git push origin HEAD:gh-pages
          fi

          echo "=== VERIFY PUBLIC CONTENTS ==="
          curl -fsSI \
            https://rejjalmakky.github.io/bang-rm-apt/dists/stable/Contents-aarch64.gz

          echo "=== BANG RM APT CONTENTS READY ==="

      - name: Build BANG RM ARM64 bootstrap
        run: |
          ./scripts/run-docker.sh \
            ./scripts/build-bootstraps.sh \
            --architectures aarch64 \
            --no-build-unneeded-subpackages

      - name: Verify bootstrap
        run: |
          echo "=== Bootstrap files ==="
          find . -name "bootstrap-aarch64.zip" -type f -print
          echo
          echo "=== SHA256 ==="
          find . -name "bootstrap-aarch64.zip" -type f -exec sha256sum {} \;

      - name: Upload BANG RM bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: bang-rm-bootstrap-aarch64
          path: "**/bootstrap-aarch64.zip"
          if-no-files-found: error

  validate-apt:
    name: Validate BANG RM APT metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout BANG RM packages
        uses: actions/checkout@v4

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Create validation Debian package
        run: |
          set -e

          rm -rf apt-validation
          mkdir -p \
            apt-validation/pool/main/test-package/DEBIAN \
            apt-validation/pool/main/test-package/usr/share/doc/bang-rm-apt-validation

          cat > apt-validation/pool/main/test-package/DEBIAN/control <<'EOF'
          Package: bang-rm-apt-validation
          Version: 1.0.0
          Section: misc
          Priority: optional
          Architecture: all
          Maintainer: BANG RM <bangrm@example.invalid>
          Description: BANG RM APT metadata validation package
          EOF

          printf '%s\n' \
            'BANG RM APT metadata validation package' \
            > apt-validation/pool/main/test-package/usr/share/doc/bang-rm-apt-validation/README

          dpkg-deb --build \
            apt-validation/pool/main/test-package \
            apt-validation/pool/main/bang-rm-apt-validation_1.0.0_all.deb

          rm -rf apt-validation/pool/main/test-package

      - name: Build Packages indexes
        run: |
          set -e

          cd apt-validation

          for ARCH in aarch64 arm i686 x86_64; do
            mkdir -p "dists/stable/main/binary-${ARCH}"

            dpkg-scanpackages \
              --arch "$ARCH" \
              pool/main \
              /dev/null \
              2>/dev/null || true

            {
              dpkg-scanpackages \
                --arch "$ARCH" \
                pool/main \
                /dev/null \
                2>/dev/null || true

              dpkg-scanpackages \
                --arch all \
                pool/main \
                /dev/null \
                2>/dev/null || true
            } > "dists/stable/main/binary-${ARCH}/Packages"

            gzip -9c \
              "dists/stable/main/binary-${ARCH}/Packages" \
              > "dists/stable/main/binary-${ARCH}/Packages.gz"
          done

      - name: Build Contents indexes
        run: |
          set -e

          cd apt-validation

          for ARCH in aarch64 arm i686 x86_64; do
            apt-ftparchive contents pool/main \
              > "dists/stable/Contents-${ARCH}"

            gzip -9c \
              "dists/stable/Contents-${ARCH}" \
              > "dists/stable/Contents-${ARCH}.gz"

            test -s "dists/stable/Contents-${ARCH}"
            test -s "dists/stable/Contents-${ARCH}.gz"

            gzip -t "dists/stable/Contents-${ARCH}.gz"

            echo "Contents-${ARCH}: $(wc -l < "dists/stable/Contents-${ARCH}") entries"
          done

      - name: Build Release metadata
        run: |
          set -e

          cd apt-validation

          cat > apt-ftparchive.conf <<'EOF'
          APT::FTPArchive::Release {
            Origin "BANG RM";
            Label "BANG RM";
            Suite "stable";
            Codename "stable";
            Architectures "aarch64 arm i686 x86_64";
            Components "main";
            Description "BANG RM Termux APT Repository";
          };
          EOF

          apt-ftparchive \
            -c=apt-ftparchive.conf \
            release dists/stable \
            > dists/stable/Release

      - name: Verify complete APT metadata
        run: |
          set -e

          cd apt-validation

          echo "=== APT VALIDATION ==="

          test -s dists/stable/Release

          for ARCH in aarch64 arm i686 x86_64; do
            test -s "dists/stable/main/binary-${ARCH}/Packages"
            test -s "dists/stable/main/binary-${ARCH}/Packages.gz"
            test -s "dists/stable/Contents-${ARCH}"
            test -s "dists/stable/Contents-${ARCH}.gz"

            gzip -t "dists/stable/main/binary-${ARCH}/Packages.gz"
            gzip -t "dists/stable/Contents-${ARCH}.gz"
          done

          grep -q '^Origin: BANG RM$' dists/stable/Release
          grep -q '^Suite: stable$' dists/stable/Release

          echo
          echo "=== VALIDATION PASSED ==="
          find dists/stable -type f -print | sort
